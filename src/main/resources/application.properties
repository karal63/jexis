spring.application.name=jexis-backend

application.origin=${APP_ORIGIN}
application.public-api-url=${PUBLIC_API_URL}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${APP_PORT:3000}
server.servlet.context-path=/api

jwt.secret.access=${JWT_ACCESS_SECRET}
jwt.secret.refresh=${JWT_REFRESH_SECRET}

stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret.account=${STRIPE_ACCOUNT_WEBHOOK}
stripe.webhook.secret.wallet=${STRIPE_WALLET_WEBHOOK}
stripe.webhook.secret.card=${STRIPE_CARD_WEBHOOK}
stripe.webhook.secret.authorization=${STRIPE_AUTHORIZATION_WEBHOOK}
stripe.webhook.secret.dispute=${STRIPE_DISPUTE_WEBHOOK}
stripe.webhook.secret.subscription=${STRIPE_SUBSCRIPTION_WEBHOOK}
stripe.webhook.secret.invoice=${STRIPE_INVOICE_WEBHOOK}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Flyway owns schema changes in both environments.
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.mail.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
